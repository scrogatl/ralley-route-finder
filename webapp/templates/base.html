<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rally Route Finder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Rally Route Finder</a>
    <span class="tagline">Plan scenarios on straight-line miles. No Google checks.</span>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
